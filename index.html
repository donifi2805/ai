<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>PayNusa — Bayar Semua Tagihan Jadi Mudah</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f8; --surface:#ffffff; --surface-2:#f7f8fc; --surface-3:#f1f3f9;
    --text:#0f172a; --muted:#6b7690; --border:#e7eaf3;
    --primary:#4f46e5; --primary-2:#7c3aed; --accent:#f59e0b;
    --shadow: 0 10px 30px -12px rgba(21,27,59,.18);
    --nav-bg: rgba(255,255,255,.92);
  }
  html.dark{
    --bg:#080c18; --surface:#111729; --surface-2:#161e33; --surface-3:#1c2540;
    --text:#eef2ff; --muted:#94a1c0; --border:#243050;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
    --nav-bg: rgba(17,23,41,.92);
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--text); margin:0; overflow-x:hidden;
    transition: background .3s ease, color .3s ease;
  }
  .surface{ background:var(--surface); }
  .surface-2{ background:var(--surface-2); }
  .surface-3{ background:var(--surface-3); }
  .txt{ color:var(--text); }
  .muted{ color:var(--muted); }
  .bd{ border-color:var(--border); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:1.25rem; box-shadow:var(--shadow); }
  .shell{ width:100%; max-width:468px; margin:0 auto; position:relative; min-height:100dvh; background:var(--bg); }
  @media (min-width:1024px){
    .shell{ box-shadow:0 40px 80px -30px rgba(15,23,42,.45); border-left:1px solid var(--border); border-right:1px solid var(--border); }
  }
  .no-sb::-webkit-scrollbar{ display:none; }
  .no-sb{ scrollbar-width:none; }
  .grad{ background-image:linear-gradient(135deg,#4f46e5 0%,#6d28d9 45%,#2563eb 100%); }
  .grad-txt{ background:linear-gradient(135deg,#4f46e5,#9333ea); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .press{ transition:transform .14s ease, opacity .14s ease; }
  .press:active{ transform:scale(.94); opacity:.85; }
  .tab-active{ color:var(--primary); }
  html.dark .tab-active{ color:#a5b4fc; }
  /* Sheets */
  .sheet-wrap{ position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  .sheet-bd{ position:absolute; inset:0; background:rgba(8,12,24,.55); backdrop-filter:blur(3px); opacity:0; transition:opacity .28s ease; }
  .sheet-panel{ position:relative; width:100%; max-width:468px; background:var(--surface); border-radius:1.75rem 1.75rem 0 0;
    max-height:93dvh; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .34s cubic-bezier(.32,.72,0,1); box-shadow:0 -12px 40px -12px rgba(8,12,24,.35); }
  .sheet-wrap.open .sheet-bd{ opacity:1; }
  .sheet-wrap.open .sheet-panel{ transform:translateY(0); }
  .sheet-body{ overflow-y:auto; overscroll-behavior:contain; padding-bottom:calc(1.25rem + env(safe-area-inset-bottom)); }
  .fade-in{ animation:fade .35s ease both; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .pop{ animation:pop .4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pop{ from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);} }
  .shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .skel{ background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%); background-size:200% 100%; animation:sk 1.2s infinite; }
  @keyframes sk{ from{background-position:200% 0} to{background-position:-200% 0} }
  .scanline{ position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,#34d399,transparent); box-shadow:0 0 18px 3px rgba(52,211,153,.6); animation:scan 2.2s ease-in-out infinite; }
  @keyframes scan{ 0%{top:4%} 50%{top:94%} 100%{top:4%} }
  .spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .dash{ background-image:linear-gradient(to right,var(--border) 55%,transparent 0%); background-size:12px 2px; background-repeat:repeat-x; height:2px; }
  .checkmark{ stroke-dasharray:52; stroke-dashoffset:52; animation:draw .55s .18s ease forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0 } }
  input,select,textarea{ font-family:inherit; }
  .inp{ width:100%; background:var(--surface-2); border:1.5px solid var(--border); color:var(--text); border-radius:.9rem; padding:.85rem 1rem; font-size:.95rem; font-weight:600; outline:none; transition:.18s; }
  .inp::placeholder{ color:var(--muted); font-weight:500; }
  .inp:focus{ border-color:var(--primary); background:var(--surface); box-shadow:0 0 0 4px rgba(79,70,229,.12); }
  .btn{ width:100%; border-radius:1rem; padding:.95rem 1rem; font-weight:700; font-size:.95rem; transition:.18s; }
  .btn-primary{ background-image:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; box-shadow:0 12px 24px -12px rgba(79,70,229,.9); }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.45; box-shadow:none; }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .chip{ padding:.45rem .85rem; border-radius:999px; font-size:.78rem; font-weight:700; border:1px solid var(--border); background:var(--surface); color:var(--muted); white-space:nowrap; }
  .chip.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .prod{ border:1.5px solid var(--border); background:var(--surface); border-radius:1rem; padding:.75rem .8rem; text-align:left; transition:.16s; }
  .prod.on{ border-color:var(--primary); background:rgba(79,70,229,.07); box-shadow:0 0 0 3px rgba(79,70,229,.1); }
  .key{ font-size:1.4rem; font-weight:700; padding:.7rem 0; border-radius:1rem; transition:.12s; }
  .key:active{ background:var(--surface-3); transform:scale(.95); }
  .toast{ animation:tin .3s ease both; }
  @keyframes tin{ from{ opacity:0; transform:translateY(-14px) } to{ opacity:1; transform:none } }
  .brandpanel{ display:none; }
  @media (min-width:1180px){
    .brandpanel{ display:block; position:fixed; left:max(3rem,calc(50vw - 640px)); top:50%; transform:translateY(-50%); width:min(430px,32vw); z-index:5; }
  }
  .glow{ position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; z-index:0; pointer-events:none; }
</style>
</head>
<body>

<div class="glow" style="width:420px;height:420px;background:#6366f1;top:-140px;left:-100px;"></div>
<div class="glow" style="width:380px;height:380px;background:#a855f7;bottom:-160px;right:-120px;"></div>

<!-- Desktop branding -->
<aside class="brandpanel">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-12 h-12 rounded-2xl grad grid place-items-center text-white font-extrabold text-xl shadow-lg">P</div>
    <div>
      <p class="font-extrabold text-2xl txt">PayNusa</p>
      <p class="text-xs muted font-semibold">Payment Point Online Bank</p>
    </div>
  </div>
  <h1 class="text-4xl font-extrabold leading-tight txt">Satu aplikasi untuk<br><span class="grad-txt">semua tagihan Anda.</span></h1>
  <p class="muted mt-4 text-[15px] leading-relaxed">Pulsa, paket data, token listrik, BPJS, PDAM, voucher game sampai cicilan — bayar cepat dalam hitungan detik dengan biaya paling hemat.</p>
  <div class="grid grid-cols-2 gap-3 mt-7" id="brandFeatures"></div>
  <p class="mt-7 text-xs muted font-semibold">⚡ Demo interaktif — semua data tersimpan di perangkat Anda.</p>
</aside>

<div class="shell" id="shell">
  <main id="view" class="relative z-10"></main>
  <nav id="tabbar"></nav>
</div>

<div id="sheets"></div>
<div id="toasts" class="fixed top-3 left-0 right-0 z-[90] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

const ic=(n,cls='w-5 h-5',sw=1.8)=>`<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;

/* ==================== UTILS ==================== */
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const rpShort=n=> n>=1000000? 'Rp'+(n/1000000).toFixed(n%1000000?1:0)+'jt' : n>=1000? 'Rp'+(n/1000)+'rb' : rp(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const ref=()=>'PN'+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10);
const pad=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const dt=s=>new Date(s);
const fDate=s=>{const d=dt(s);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const fTime=s=>{const d=dt(s);return `${pad(d.getHours())}:${pad(d.getMinutes())} WIB`};
const isSameDay=(a,b)=>a.toDateString()===b.toDateString();
function dayLabel(s){const d=dt(s),n=new Date(),y=new Date(Date.now()-864e5);
  if(isSameDay(d,n))return 'Hari Ini'; if(isSameDay(d,y))return 'Kemarin'; return fDate(s);}
function seedRand(str){let h=2166136261;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619);}
  return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^h>>>16)>>>0)/4294967296;};}

function toast(msg,type='info'){
  const c={info:'#4f46e5',success:'#10b981',error:'#ef4444',warn:'#f59e0b'}[type];
  const i={info:'info',success:'check',error:'alert',warn:'alert'}[type];
  const el=document.createElement('div');
  el.className='toast pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl text-white text-sm font-semibold shadow-xl max-w-[420px] w-full';
  el.style.background=c; el.innerHTML=ic(i,'w-5 h-5 shrink-0')+`<span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='.3s';el.style.opacity='0';el.style.transform='translateY(-12px)';setTimeout(()=>el.remove(),320);},2400);
}
function copyText(t,m='Disalin ke clipboard'){navigator.clipboard?.writeText(t).then(()=>toast(m,'success')).catch(()=>toast('Gagal menyalin','error'));}

function openSheet(id,{title='',sub='',body='',noPad=false,dark=false,full=false}={}){
  closeSheet(id,true);
  const w=document.createElement('div'); w.className='sheet-wrap'; w.id='sh-'+id;
  w.innerHTML=`<div class="sheet-bd" onclick="app.closeSheet('${id}')"></div>
  <div class="sheet-panel" style="${dark?'background:#0b1020;color:#fff;':''}${full?'height:93dvh;':''}">
    <div class="pt-2.5 pb-1 flex justify-center shrink-0"><div class="w-11 h-1.5 rounded-full" style="background:var(--border)"></div></div>
    ${title?`<div class="px-5 pt-1.5 pb-3 flex items-start justify-between gap-3 shrink-0">
      <div><h3 class="font-extrabold text-lg leading-tight">${title}</h3>${sub?`<p class="text-xs muted mt-0.5 font-medium" ${dark?'style="color:#94a3b8"':''}>${sub}</p>`:''}</div>
      <button onclick="app.closeSheet('${id}')" class="press w-9 h-9 rounded-full grid place-items-center shrink-0" style="background:var(--surface-2)">${ic('x','w-4.5 h-4.5','2.2')}</button>
    </div>`:''}
    <div class="sheet-body ${noPad?'':'px-5'}" id="body-${id}">${body}</div>
  </div>`;
  $('#sheets').appendChild(w); sheetStack.push(id);
  requestAnimationFrame(()=>w.classList.add('open'));
  return w;
}
function setBody(id,html){const b=document.getElementById('body-'+id); if(b)b.innerHTML=html;}
function closeSheet(id,instant){
  const w=document.getElementById('sh-'+id); if(!w)return;
  sheetStack=sheetStack.filter(x=>x!==id);
  if(instant){w.remove();return;}
  w.classList.remove('open'); setTimeout(()=>w.remove(),320);
}
function closeAllSheets(){[...sheetStack].forEach(id=>closeSheet(id));sheetStack=[];}

/* -------- HISTORY -------- */
let hFilter='all', hQuery='';
function viewHistory(){
  const now=new Date();
  const monthTx=S.tx.filter(t=>dt(t.date).getMonth()===now.getMonth()&&dt(t.date).getFullYear()===now.getFullYear()&&t.status==='success');
  const spent=monthTx.reduce((a,b)=>a+b.total,0);
  let list=[...S.tx].sort((a,b)=>dt(b.date)-dt(a.date));
  if(hFilter!=='all')list=list.filter(t=>t.status===hFilter);
  if(hQuery)list=list.filter(t=>(t.product+t.customer+t.serviceName+t.ref).toLowerCase().includes(hQuery.toLowerCase()));
  const groups={};list.forEach(t=>{const k=dayLabel(t.date);(groups[k]=groups[k]||[]).push(t);});
  const chips=[['all','Semua'],['success','Berhasil'],['pending','Menunggu'],['failed','Gagal']];
  return `<div class="fade-in">
    <div class="grad px-5 pt-[calc(1.25rem+env(safe-area-inset-top))] pb-16 rounded-b-[2rem] relative overflow-hidden">
      <div class="absolute -right-8 -top-12 w-40 h-40 rounded-full bg-white/10"></div>
      <h1 class="text-white font-extrabold text-xl relative">Riwayat Transaksi</h1>
      <p class="text-white/80 text-[12.5px] font-medium mt-0.5 relative">Semua aktivitas pembayaran Anda</p>
    </div>
    <div class="px-4 -mt-10 relative z-10">
      <div class="card p-4 grid grid-cols-3 divide-x" style="border-color:var(--border)">
        <div class="pr-2"><p class="text-[10.5px] muted font-bold">Pengeluaran Bulan Ini</p><p class="font-extrabold txt text-[15px] mt-0.5">${rp(spent)}</p></div>
        <div class="px-3"><p class="text-[10.5px] muted font-bold">Transaksi</p><p class="font-extrabold txt text-[15px] mt-0.5">${monthTx.length}x</p></div>
        <div class="pl-3"><p class="text-[10.5px] muted font-bold">Poin Didapat</p><p class="font-extrabold text-[15px] mt-0.5" style="color:var(--accent)">+${Math.floor(spent/1000)}</p></div>
      </div>
    </div>
    <div class="px-4 mt-4">
      <div class="flex items-center gap-2.5 px-4 py-2.5 rounded-2xl surface border bd">
        ${ic('search','w-4.5 h-4.5 muted')}
        <input value="${hQuery}" oninput="app.setSearch(this.value)" placeholder="Cari transaksi atau no. referensi" class="flex-1 bg-transparent outline-none text-[13px] font-semibold txt placeholder:font-medium" style="color:var(--text)">
        ${hQuery?`<button onclick="app.setSearch('')" class="press muted">${ic('x','w-4 h-4')}</button>`:''}
      </div>
      <div class="flex gap-2 mt-3 overflow-x-auto no-sb">
        ${chips.map(([v,l])=>`<button onclick="app.setFilter('${v}')" class="press chip ${hFilter===v?'on':''}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="px-4 mt-4 space-y-4">
      ${Object.keys(groups).length?Object.entries(groups).map(([d,items])=>`
        <div><p class="text-[11.5px] font-extrabold muted mb-1.5 px-1">${d}</p>
        <div class="card px-4 py-1 divide-y" style="border-color:var(--border)">${items.map(txRow).join('')}</div></div>`).join(''):

      <div class="grid grid-cols-3 gap-2 mt-2.5">${products.map((p,i)=>`<button onclick="app.selectProduct(${i})" class="press prod text-center ${sel===i?'on':''}"><p class="font-extrabold txt text-[12.5px]">${p.name.replace('Rp ','')}</p></button>`).join('')}</div>`;
  } else {
    html+=`<p class="text-[12px] font-extrabold muted mt-4 mb-2">Pilih Nominal / Produk</p>
      <div class="grid grid-cols-2 gap-2.5">${products.map((p,i)=>`
        <button onclick="app.selectProduct(${i})" class="press prod ${sel===i?'on':''}">
          <p class="font-extrabold txt text-[13px] leading-tight">${p.name}</p>
          ${p.sub?`<p class="text-[10.5px] muted font-semibold mt-0.5">${p.sub}</p>`:''}
          <p class="text-[13px] font-extrabold mt-1.5" style="color:var(--primary)">${rp(p.price)}</p>
          ${sel===i?`<span class="absolute"></span>`:''}
        </button>`).join('')}</div>`;
  }
  const total=calcTotal();
  html+=`</div>`;
  html+=`<div class="sticky bottom-0 pt-3 pb-[calc(.75rem+env(safe-area-inset-bottom))]" style="background:linear-gradient(to top,var(--surface) 70%,transparent)">
    ${total?`<div class="flex items-center justify-between mb-2.5 px-1"><span class="text-[12.5px] muted font-bold">Total Pembayaran</span><span class="text-[17px] font-extrabold txt">${rp(total)}</span></div>`:''}
    ${s.type==='post'&&!F.bill?
      `<button onclick="app.checkBill()" ${F.customer.length<4||F.checking?'disabled':''} class="btn btn-primary">${F.checking?'Mengecek...':'Cek Tagihan'}</button>`:
      `<button onclick="app.toConfirm()" ${canProceed()?'':'disabled'} class="btn btn-primary">Lanjutkan Pembayaran</button>`}
  </div>`;
  setBody('svc',html);
}
function calcTotal(){
  const s=SV[F.sid];
  if(s.type==='post')return F.bill?F.bill.amount+F.admin-F.discount:0;
  if(s.free){const v=parseInt((F.free||'').replace(/\D/g,''))||0;return v?v+F.admin-F.discount:0;}
  const products=s.productsBy?(s.productsBy[F.provider]||[]):(s.products||[]);
  return F.product!=null&&products[F.product]?products[F.product].price+F.admin-F.discount:0;
}
function canProceed(){
  const s=SV[F.sid]; if(F.customer.trim().length<3)return false;
  if(s.type==='post')return !!F.bill;
  if(s.free)return (parseInt((F.free||'').replace(/\D/g,''))||0)>=10000;
  return F.product!=null;
}
function productName(){
  const s=SV[F.sid];
  if(s.type==='post')return ((F.provider?F.provider+' · ':'')+s.name+' '+(F.bill?F.bill.period:'')).trim();
  if(s.free)return (F.provider||s.name)+' '+rp(parseInt((F.free||'').replace(/\D/g,''))||0);
  const products=s.productsBy?(s.productsBy[F.provider]||[]):(s.products||[]);
  const p=products[F.product]; const pre=s.op?detectOp(F.customer)+' ':(F.provider?F.provider+' ':'');
  return (pre+p.name).trim();
}

/* ==================== APP ACTIONS ==================== */
const app={
  toast,copy:copyText,closeSheet,
  go(t){S.tab=t;save();render();window.scrollTo({top:0,behavior:'smooth'});},
  goHistory(){hFilter='all';hQuery='';app.go('history');},
  toggleBalance(){S.settings.hideBalance=!S.settings.hideBalance;save();render();},
  openAllServices,openService,openNotif,openTopup,openTransfer,openTarik,openQris,openTxDetail,openEditProfile,openSecurity,openSheetMenu,qrisSimulate,
  /* service */
  setProvider(p){F.provider=p;F.product=null;F.bill=null;renderSvc();},
  setCustomer(v){F.customer=v;F.bill=null;renderSvc();const i=document.getElementById('custInp');if(i){i.focus();i.setSelectionRange(v.length,v.length);}},
  setFree(v){const n=v.replace(/\D/g,'');F.free=n?parseInt(n).toLocaleString('id-ID'):'';F.product=null;renderSvc();
    const i=document.getElementById('freeAmt');if(i){i.focus();i.setSelectionRange(F.free.length,F.free.length);}},
  selectProduct(i){const s=SV[F.sid];if(s.free){const p=(s.products||[])[i];F.free=p.price.toLocaleString('id-ID');F.product=i;}else F.product=i;renderSvc();},
  checkBill(){F.checking=true;renderSvc();
    setTimeout(()=>{const s=SV[F.sid];const r=seedRand(F.sid+F.customer);
      const [lo,hi]=s.billRange;const amt=Math.round((lo+r()*(hi-lo))/500)*500;
      const m=new Date();const per=MONL[(m.getMonth()+11)%12]+' '+m.getFullYear();
      const period=s.id==='multifinance'?('Angsuran ke-'+Math.floor(r()*24+1)+' · '+per):(s.id==='pbb'?'Tahun '+m.getFullYear():(s.id==='esamsat'?'Jatuh tempo '+per:per));
      F.bill={name:custName(F.customer),amount:amt,period};
      F.checking=false;renderSvc();toast('Tagihan ditemukan','success');},1300);},
  toConfirm(){if(!canProceed())return;F.discount=0;F.voucher=null;openConfirm();},
  setMethod(m){F.method=m;renderConfirm();},
  openVoucherPicker(){
    const total=calcTotal()+F.discount;
    const avail=S.vouchers.filter(v=>v.claimed&&!v.used);
    openSheet('vc',{title:'Pilih Voucher',sub:'Voucher yang sudah Anda klaim'});
    setBody('vc',`<div class="pb-6 space-y-2">
      ${avail.length?avail.map(v=>{const ok=(!v.svc.length||v.svc.includes(F.sid))&&total>=v.min;
        return `<button onclick="${ok?`app.applyVoucher('${v.code}')`:`app.toast('Voucher tidak berlaku untuk transaksi ini','warn')`}" class="press w-full card p-4 text-left ${ok?'':'opacity-50'}">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl grid place-items-center text-white shrink-0 grad">${ic('ticket','w-5 h-5')}</div>
        <div class="flex-1 min-w-0"><p class="text-[13px] font-extrabold txt">${v.title}</p><p class="text-[11.5px] muted font-medium">${v.desc}</p>
        ${!ok?`<p class="text-[11px] font-bold text-red-500 mt-0.5">Tidak berlaku · min. ${rp(v.min)}</p>`:''}</div>
        ${ok?ic('chevR','w-4 h-4 muted','2.4'):''}</div></button>`}).join(''):
        `<p class="text-center py-10 text-sm muted font-semibold">Belum ada voucher. Klaim dulu di halaman Promo.</p>`}
      <button onclick="app.go('promo');app.closeSheet('vc')" class="btn btn-ghost mt-2">Lihat Semua Promo</button></div>`);},
  applyVoucher(code){const v=S.vouchers.find(x=>x.code===code);const base=calcTotal()+F.discount;
    let d=v.type==='pct'?Math.min(Math.round(base*v.val/100),v.max):v.val;
    d=Math.min(d,base-1000);F.discount=d;F.voucher=code;closeSheet('vc');renderConfirm();toast('Voucher diterapkan, hemat '+rp(d),'success');},
  removeVoucher(){F.discount=0;F.voucher=null;renderConfirm();},
  useVoucherNow(code){const v=S.vouchers.find(x=>x.code===code);toast('Pilih layanan lalu voucher '+v.code+' bisa dipakai','info');app.openAllServices();},
  claimVoucher(code){const v=S.vouchers.find(x=>x.code===code);v.claimed=true;save();render();toast('Voucher '+code+' berhasil diklaim!','success');},
  payNow(){
    const total=calcTotal();
    if(F.method==='saldo'){
      if(S.balance<total){toast('Saldo tidak mencukupi','error');return;}
      openPin(()=>{closeSheet('pin');processing('Memproses pembayaran...',()=>{
        S.balance-=total;const tx=buildTx(total,'Saldo PayNusa','success');finishTx(tx);});});
    } else if(F.method==='card'){
      openPin(()=>{closeSheet('pin');processing('Memverifikasi kartu...',()=>{
        const tx=buildTx(total,'Kartu Kredit **** 4829','success');finishTx(tx);});},'Masukkan PIN Kartu');
    } else {
      const tx=buildTx(total,F.method==='va'?'BCA Virtual Account':'Alfamart / Indomaret','pending');
      closeSheet('cf');setTimeout(()=>openVA(F.method,tx),200);
    }},
  simulatePaid(){clearInterval(vaTimer);const tx=F.pendingTx;closeSheet('va');
    processing('Mengonfirmasi pembayaran...',()=>{tx.status='success';tx.date=new Date().toISOString();finishTx(tx);});},
  pinPress(d){if(pinBuf.length>=6)return;pinBuf+=d;renderPin();
    if(pinBuf.length===6){setTimeout(()=>{
      if(pinBuf===S.pin){pinTries=0;pinCb&&pinCb();}
      else{pinTries++;pinBuf='';renderPin();const p=document.getElementById('pinDots');if(p)p.classList.add('shake');
        toast(pinTries>=3?'PIN salah. Sisa percobaan '+(5-pinTries):'PIN salah, coba lagi','error');setTimeout(()=>p&&p.classList.remove('shake'),450);}
    },160);}},
  pinDel(){pinBuf=pinBuf.slice(0,-1);renderPin();},
  forgotPin(){toast('Demo: PIN Anda adalah 123456','info');},
  /* success */
  closeSuccess(){document.getElementById('succ')?.remove();render();},
  downloadReceipt(id){const t=S.tx.find(x=>x.id===id);if(!t)return;
    const L=['==============================','        PAYNUSA - STRUK','==============================',
      'No. Ref     : '+t.ref,'Tanggal     : '+fDate(t.date)+' '+fTime(t.date),'Status      : '+t.status.toUpperCase(),
      '------------------------------','Layanan     : '+t.serviceName,'Produk      : '+t.product,'Tujuan      : '+t.customer,
      'Nama        : '+(t.customerName||'-'),t.token?'Token       : '+t.token:'','------------------------------',
      'Harga       : '+rp(t.amount),'Admin       : '+(t.admin?rp(t.admin):'Gratis'),t.discount?'Diskon      : -'+rp(t.discount):'',
      'TOTAL       : '+rp(t.total),'Metode      : '+t.method,'==============================','  Terima kasih telah bertransaksi','      www.paynusa.co.id'].filter(Boolean).join('\n');
    const b=new Blob([L],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');
    a.href=u;a.download='Struk-'+t.ref+'.txt';a.click();URL.revokeObjectURL(u);toast('Struk berhasil diunduh','success');},
  shareTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;
    const txt=`Struk PayNusa\n${t.product}\nTujuan: ${t.customer}\nTotal: ${rp(t.total)}\nRef: ${t.ref}\nStatus: ${t.status.toUpperCase()}`;
    if(navigator.share)navigator.share({title:'Struk PayNusa',text:txt}).catch(()=>{});else copyText(txt,'Struk disalin ke clipboard');},
  repeatTx(id){const t=S.tx.find(x=>x.id===id);closeSheet('td');setTimeout(()=>openService(t.sid,t.customer),250);},
  checkStatus(id){const t=S.tx.find(x=>x.id===id);closeSheet('td');
    processing('Mengecek status...',()=>{t.status='success';save();toast('Pembayaran terkonfirmasi!','success');render();setTimeout(()=>openTxDetail(id),200);});},
  setFilter(f){hFilter=f;render();},
  setSearch(v){hQuery=v;render();const i=document.querySelector('input[placeholder^="Cari transaksi"]');if(i){i.focus();i.setSelectionRange(v.length,v.length);}},
  searchServices(q){openAllServices(q);},
  markAllRead(){S.notifs.forEach(n=>n.read=true);save();openNotif();render();toast('Semua notifikasi telah dibaca','success');},
  /* topup */
  setTopupAmt(v){F.topup.amt=parseInt(String(v).replace(/\D/g,''))||0;renderTopup();
    const i=document.getElementById('tuAmt');if(i){const s=i.value.length;i.focus();i.setSelectionRange(s,s);}},
  setTopupMethod(i){F.topup.method=i;renderTopup();},
  doTopup(){const amt=F.topup.amt;closeSheet('tu');
    setTimeout(()=>{openPin(()=>{closeSheet('pin');processing('Memproses top up...',()=>{
      S.balance+=amt;S.notifs.unshift({id:uid(),title:'Top Up Berhasil',body:`Saldo ${rp(amt)} telah masuk ke akun Anda.`,time:new Date().toISOString(),read:false,type:'success'});
      const tx={id:uid(),ref:ref(),sid:'topup',serviceName:'Top Up Saldo',product:'Top Up Saldo '+rp(amt),customer:S.user.phone,customerName:S.user.name,
        amount:amt,admin:0,discount:0,total:amt,method:'Virtual Account',status:'success',date:new Date().toISOString()};
      S.tx.unshift(tx);save();render();toast('Top up berhasil! Saldo bertambah '+rp(amt),'success');});},'Konfirmasi Top Up');},220);},
  /* transfer */
  setTfBank(b){F.tf.bank=b;renderTransfer();},
  setTfAcc(v){F.tf.acc=v.replace(/\D/g,'');renderTransfer();},
  setTfAmt(v){F.tf.amt=parseInt(String(v).replace(/\D/g,''))||0;renderTransfer();},
  setTfNote(v){F.tf.note=v;},
  doTransfer(){const t=F.tf;const total=t.amt+2500;
    if(S.balance<total){toast('Saldo tidak mencukupi','error');return;}
    closeSheet('tf');setTimeout(()=>openPin(()=>{closeSheet('pin');processing('Mengirim dana...',()=>{
      S.balance-=total;
      const tx={id:uid(),ref:ref(),sid:'transfer',serviceName:'Transfer Dana',product:'Transfer ke '+t.bank+' '+t.acc,customer:t.acc,customerName:custName(t.acc),
        amount:t.amt,admin:2500,discount:0,total,method:'Saldo PayNusa',status:'success',date:new Date().toISOString()};
      S.tx.unshift(tx);S.points+=Math.floor(total/1000);
      S.notifs.unshift({id:uid(),title:'Transfer Berhasil',body:`Transfer ${rp(t.amt)} ke ${custName(t.acc)} (${t.bank}) berhasil.`,time:new Date().toISOString(),read:false,type:'success'});
      save();showSuccess(tx);render();});}),220);},
  doTarik(a){const total=a+2500;
    if(S.balance<total){toast('Saldo tidak mencukupi','error');return;}
    closeSheet('tk');setTimeout(()=>openPin(()=>{closeSheet('pin');processing('Membuat kode penarikan...',()=>{
      S.balance-=total;const code=String(Math.floor(Math.random()*9e5+1e5))+' '+String(Math.floor(Math.random()*9e5+1e5));
      const tx={id:uid(),ref:ref(),sid:'tarik',serviceName:'Tarik Tunai',product:'Tarik Tunai '+rp(a),customer:S.user.phone,customerName:S.user.name,
        amount:a,admin:2500,discount:0,total,method:'Saldo PayNusa',status:'success',date:new Date().toISOString(),token:code};
      S.tx.unshift(tx);save();showSuccess(tx);render();toast('Kode penarikan berhasil dibuat','success');});}),220);},
  /* qris */
  setQrAmt(v){const n=parseInt(String(v).replace(/\D/g,''))||0;F.amount=n;
    const i=document.getElementById('qrAmt');if(i){i.value=n?n.toLocaleString('id-ID'):'';const s=i.value.length;i.setSelectionRange(s,s);}
    const b=document.getElementById('qrPayBtn');if(b){b.disabled=n<1000;b.textContent=n?'Bayar '+rp(n):'Bayar Sekarang';}},
  qrisPay(){const total=F.amount;if(S.balance<total){toast('Saldo tidak mencukupi','error');return;}
    closeSheet('qm');setTimeout(()=>openPin(()=>{closeSheet('pin');processing('Memproses pembayaran QRIS...',()=>{
      S.balance-=total;
      const tx={id:uid(),ref:ref(),sid:'qris',serviceName:'Pembayaran QRIS',product:F.merchant[0],customer:F.merchant[0],customerName:F.merchant[1],
        amount:total,admin:0,discount:0,total,method:'Saldo PayNusa (QRIS)',status:'success',date:new Date().toISOString()};
      S.tx.unshift(tx);S.points+=Math.floor(total/1000);
      S.notifs.unshift({id:uid(),title:'Pembayaran QRIS Berhasil',body:`Pembayaran ${rp(total)} di ${F.merchant[0]} berhasil.`,time:new Date().toISOString(),read:false,type:'success'});
      save();showSuccess(tx);render();});}),220);},

      <button onclick="app.toast('QR berhasil disimpan ke galeri','success')" class="btn btn-ghost mt-4">Simpan Gambar QR</button></div>`);},220);},

    S.user.address=document.getElementById('epAddr').value;save();closeSheet('ep');render();toast('Profil berhasil diperbarui','success');},
  changePin(){const o=document.getElementById('pinOld').value,n=document.getElementById('pinNew').value,n2=document.getElementById('pinNew2').value;

      <button onclick="app.doReset()" class="btn" style="background:#ef4444;color:#fff">Ya, Reset Sekarang</button>
      <button onclick="app.closeSheet('rs')" class="btn btn-ghost mt-2">Batal</button></div>`);},
  doReset(){const dark=S.settings.dark;localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEFAULT));S.settings.dark=dark;save();closeAllSheets();render();toast('Data demo berhasil direset','success');},
  logout(){openSheet('lo',{title:'Keluar dari akun?',sub:'Anda perlu masuk kembali untuk bertransaksi'});
    setBody('lo',`<div class="pb-6"><button onclick="app.doLogout()" class="btn" style="background:#ef4444;color:#fff">Ya, Keluar</button>
      <button onclick="app.closeSheet('lo')" class="btn btn-ghost mt-2">Batal</button></div>`);},
  doLogout(){closeAllSheets();S.loggedIn=false;save();render();toast('Anda telah keluar','info');},
  doLogin(){processing('Memverifikasi...',()=>{S.loggedIn=true;S.tab='home';save();render();toast('Selamat datang kembali, '+S.user.name.split(' ')[0]+'!','success');});},
};
function buildTx(total,method,status){
  const s=SV[F.sid];
  return {id:uid(),ref:ref(),sid:F.sid,serviceName:s.name,product:productName(),customer:F.customer,
    customerName:F.bill?F.bill.name:(s.lookup?custName(F.customer):(s.op?detectOp(F.customer)+' Prabayar':'-')),
    amount:total+F.discount-F.admin,admin:F.admin,discount:F.discount,total,method,status,date:new Date().toISOString(),
    token:F.sid==='pln'?Array.from({length:20},()=>Math.floor(Math.random()*10)).join('').replace(/(\d{4})(?=\d)/g,'$1 '):null,
    serial:['pulsa','data','voucher','streaming','game','emoney'].includes(F.sid)?'SN'+Date.now().toString().slice(-10):null};
}
window.app=app;
/* init */
applyTheme();render();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetStack.length)closeSheet(sheetStack[sheetStack.length-1]);});
</script>
</body>
</html>
