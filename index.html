<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>H2H Integration Center</title>
</head>
<body style="background:#080d1a; color:#38bdf8; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
  <div>Memuat Sistem Terproteksi...</div>
  <script>
    // MENGAMBIL Halaman Utama via Dynamic Fetch & Render
    fetch('home.html?_t=' + Date.now(), { cache: 'no-store' })
      .then(res => res.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</body>
</html>
