  <style>
    :root {
      --bg: #eef1f8;
      --surface: #ffffff;
      --surface-2: #f7f8fc;
      --surface-3: #f1f3f9;
      --text: #0f172a;
      --muted: #6b7690;
      --border: #e7eaf3;
      --primary: #cc0000;
      --primary-2: #990000;
      --accent: #f59e0b;
      --shadow: 0 10px 30px -12px rgba(21, 27, 59, 0.18);
      --nav-bg: rgba(255, 255, 255, 0.92);
    }
    html.dark {
      --bg: #080c18;
      --surface: #111729;
      --surface-2: #161e33;
      --surface-3: #1c2540;
      --text: #eef2ff;
      --muted: #94a1c0;
      --border: #243050;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
      --nav-bg: rgba(17, 23, 41, 0.92);
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      height: 100%;
    }
    body {
      font-family:
        "Plus Jakarta Sans",
        system-ui,
        -apple-system,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      overflow-x: hidden;
      transition:
        background 0.3s ease,
        color 0.3s ease;
    }
    .surface {
      background: var(--surface);
    }
    .surface-2 {
      background: var(--surface-2);
    }
    .surface-3 {
      background: var(--surface-3);
    }
    .txt {
      color: var(--text);
    }
    .muted {
      color: var(--muted);
    }
    .bd {
      border-color: var(--border);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
    }
    .shell {
      width: 100%;
      max-width: 468px;
      margin: 0 auto;
      position: relative;
      min-height: 100dvh;
      background: var(--bg);
    }
    @media (min-width: 1024px) {
      .shell {
        box-shadow: 0 40px 80px -30px rgba(15, 23, 42, 0.45);
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }
    .no-sb::-webkit-scrollbar {
      display: none;
    }
    .no-sb {
      scrollbar-width: none;
    }
    .grad {
      background-image: linear-gradient(135deg, #cc0000 0%, #aa0000 45%, #990000 100%);
    }
    .grad-txt {
      background: linear-gradient(135deg, #cc0000, #990000);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .press {
      transition:
        transform 0.14s ease,
        opacity 0.14s ease;
    }
    .press:active {
      transform: scale(0.94);
      opacity: 0.85;
    }
    .tab-active {
      color: var(--primary);
    }
    html.dark .tab-active {
      color: #a5b4fc;
    }
    /* Sheets */
    .sheet-wrap {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-bd {
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 24, 0.55);
      backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    .sheet-panel {
      position: relative;
      width: 100%;
      max-width: 468px;
      background: var(--surface);
      border-radius: 1.75rem 1.75rem 0 0;
      max-height: 93dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.34s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -12px 40px -12px rgba(8, 12, 24, 0.35);
    }
    .sheet-wrap.open .sheet-bd {
      opacity: 1;
    }
    .sheet-wrap.open .sheet-panel {
      transform: translateY(0);
    }
    .sheet-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
    }
    .fade-in {
      animation: fade 0.35s ease both;
    }
    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    .pop {
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .shake {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-9px);
      }
      40% {
        transform: translateX(9px);
      }
      60% {
        transform: translateX(-6px);
      }
      80% {
        transform: translateX(6px);
      }
    }
    .skel {
      background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite;
    }
    @keyframes sk {
      from {
        background-position: 200% 0;
      }
      to {
        background-position: -200% 0;
      }
    }
    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      box-shadow: 0 0 18px 3px rgba(52, 211, 153, 0.6);
      animation: scan 2.2s ease-in-out infinite;
    }
    @keyframes scan {
      0% {
        top: 4%;
      }
      50% {
        top: 94%;
      }
      100% {
        top: 4%;
      }
    }
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .dash {
      background-image: linear-gradient(to right, var(--border) 55%, transparent 0%);
      background-size: 12px 2px;
      background-repeat: repeat-x;
      height: 2px;
    }
    .checkmark {
      stroke-dasharray: 52;
      stroke-dashoffset: 52;
      animation: draw 0.55s 0.18s ease forwards;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    input,
    select,
    textarea {
      font-family: inherit;
    }
    .inp {
      width: 100%;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 0.9rem;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: 0.18s;

    .inp::placeholder {

      font-weight: 500;
    }
    .inp:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(204, 0, 0, 0.12);
    }
    .btn {

      border-radius: 1rem;
      padding: 0.95rem 1rem;
      font-weight: 700;
      font-size: 0.95rem;
      transition: 0.18s;

    .btn-primary {

      background: var(--surface);

    .chip.on {

    .prod {

    .key:active {

      from {

      to {

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }

</head>

    function calcCRC16(str) {
      let crc = 0xFFFF;
      for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      else crc = (crc << 1) & 0xFFFF;
    }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }
    
    function makeDynamicQRIS(staticQris, amount, merchantName) {
      if (!staticQris) return null;
      let raw = staticQris.trim();
      if (raw.includes("6304")) {
        raw = raw.substring(0, raw.lastIndexOf("6304"));
      }
      const tags = [];
      let i = 0;
      while (i < raw.length) {
        if (i + 4 > raw.length) break;
        const tag = raw.substr(i, 2);
        const len = parseInt(raw.substr(i + 2, 2), 10);
        if (isNaN(len) || i + 4 + len > raw.length) break;
        const val = raw.substr(i + 4, len);
        tags.push({ tag, val });
        i += 4 + len;
      }
      let found01 = false;
      for (let t of tags) {
        if (t.tag === "01") {
          t.val = "12";
          found01 = true;
          break;
        }
      }
      if (!found01) {
        tags.unshift({ tag: "01", val: "12" });
      }
      if (merchantName && merchantName.trim()) {
        const nameStr = merchantName.trim().toUpperCase().slice(0, 25);
        let found59 = false;
        for (let t of tags) {
          if (t.tag === "59") {
            t.val = nameStr;
            found59 = true;
            break;
          }
        }
        if (!found59) {
          tags.push({ tag: "59", val: nameStr });
        }
      }
      const amtStr = Math.round(amount).toString();
      let found54 = false;
      for (let t of tags) {
        if (t.tag === "54") {
          t.val = amtStr;
          found54 = true;
          break;
        }
      }
      if (!found54) {
        let insertIdx = tags.findIndex(t => t.tag === "58" || t.tag === "59" || t.tag === "60");
        if (insertIdx === -1) insertIdx = tags.length;
        tags.splice(insertIdx, 0, { tag: "54", val: amtStr });
      }
      let result = "";
      for (let t of tags) {
        const lenStr = String(t.val.length).padStart(2, "0");
        result += t.tag + lenStr + t.val;
      }
      result += "6304";
      result += calcCRC16(result);
      return result;
    }

    function secSign(action, dataObj) {

    async function callSecureApi(endpoint, action, dataObj) {
      const body = JSON.stringify(secSign(action, dataObj));
      const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          signal: ctrl ? ctrl.signal : undefined,
        });
        return await res.json();
      } finally {
        if (timer) clearTimeout(timer);
      }

        if (Array.isArray(data)) {
          rawList = data;
        } else if (data && typeof data === "object") {
          if (Array.isArray(data.data)) rawList = data.data;
          else if (Array.isArray(data.produk)) rawList = data.produk;
          else if (Array.isArray(data.products)) rawList = data.products;
          else if (Array.isArray(data.result)) rawList = data.result;
          else if (Array.isArray(data.list)) rawList = data.list;
          else {
            const values = Object.values(data);
            if (
              values.length > 0 &&
              values.some((v) => v && typeof v === "object" && (v.kode || v.nama || v.harga))
            ) {
              rawList = values.filter((v) => v && typeof v === "object");
            }
          }
        }
    
        if (rawList.length > 0) {
          API_PRODUCTS = rawList
            .filter(
              (p) =>
                p &&
                (p.status === "READY" || p.status === "1" || p.status === true || !p.status) &&
                !isBayarProduct(p.kode || p.code),
            )
            .map((p) => {
              const cd = p.kode || p.code || "";
              if (isCekProduct(cd)) {
                let nm = p.nama || "";
                if (/^cek\s+tagihan\s+/i.test(nm)) {
                  nm = nm.replace(/^cek\s+tagihan\s+/i, "Cek&Bayar ");
                } else if (/^cek\s+/i.test(nm)) {
                  nm = nm.replace(/^cek\s+/i, "Cek&Bayar ");
                } else if (!nm.toLowerCase().includes("cek&bayar")) {
                  nm = "Cek&Bayar " + nm;
                }
                return { ...p, nama: nm };
              }
              return p;
            });
          console.log("[PayNusa API] Berhasil mengekstrak & memuat " + API_PRODUCTS.length + " produk (Produk BAYAR tersembunyi & Cek diubah menjadi Cek&Bayar)");
        } else {
          console.error("[PayNusa API] Gagal mengekstrak array produk. Format data:", JSON.stringify(data));
          if (data && data.message) {
            toast("API Error: " + data.message, "error");

            toast("Format respon API tidak valid (Cek F12)", "error");

      } catch (e) {
        console.error("[PayNusa API] Exception / Connection Error:", e);
        toast("Gagal terhubung ke api/api4.php. Cek konsol F12", "error");
      } finally {
        apiProductsLoaded = true;
      }
      return API_PRODUCTS;
    }
    
    function deriveSubTypes(s, provider, products) {
      if (!products || !products.length) return [];
      const provUpper = (provider || "").toUpperCase();
    
      if (s.id === "pln") {
        return ["PLN Reguler", "PLN Promo", "PLN H2H", "PLN Full Reply"];
      }
      if (s.id === "emoney") {
        if (provUpper.includes("GRAB")) return ["Semua", "Penumpang", "Driver", "Food", "Transport"];
        if (provUpper.includes("GOPAY")) return ["Semua", "Customer", "Driver"];
        if (provUpper.includes("MAXIM")) return ["Semua", "Customer", "Driver"];
      }
      if (s.id === "data") {
        if (provUpper.includes("TELKOMSEL"))
          return ["Semua", "Mini", "Super Seru", "Orbit", "MaxStream", "Ketengan", "Roamax"];
        if (provUpper.includes("XL")) return ["Semua", "Flex", "Bebas Puas", "Hotrod", "Blue", "Circle"];
        if (provUpper.includes("INDOSAT")) return ["Semua", "Freedom", "Yellow", "Mini", "Combo"];
        if (provUpper.includes("TRI")) return ["Semua", "Happy", "AON", "Mini", "Harian"];
        if (provUpper.includes("SMART")) return ["Semua", "Nonstop", "Unlimited", "Mifi", "Big Kuota"];
        if (provUpper.includes("AXIS")) return ["Semua", "Bronet", "Aigo", "Warnet", "Mini"];
        if (provUpper.includes("BYU") || provUpper.includes("BY.U"))
          return ["Semua", "Reguler", "Topping", "Voucher"];
      }
      if (s.id === "game") {
        if (provUpper.includes("MOBILE LEGENDS") || provUpper.includes("ML"))
          return ["Semua", "Diamond", "Weekly Pass", "Starlight", "Membership"];
        if (provUpper.includes("FREE FIRE") || provUpper.includes("FF"))
          return ["Semua", "Diamond", "Membership", "Level Up Pass"];
        if (provUpper.includes("PUBG")) return ["Semua", "UC", "Voucher", "Pass"];
      }
    
      const set = new Set();
      products.forEach((p) => {
        if (
          p.rawSubfilter &&
          ![
            "XL",
            "TELKOMSEL",
            "INDOSAT",
            "TRI",
            "AXIS",
            "SMARTFREN",
            "BYU",
            "GOPAY",
            "GRAB",
            "OVO",
            "DANA",
            "SHOPEEPAY",
            "LINKAJA",
            "ISAKU",
            "MANDIRI",
            "BRI",
            "BCA",
          ].includes(p.rawSubfilter.toUpperCase())
        ) {
          set.add(p.rawSubfilter);
        }
      });
      if (set.size >= 2 && set.size <= 8) {
        return ["Semua", ...Array.from(set)];
      }
      return [];

    function matchSubType(p, subType) {
      if (!subType || subType === "Semua") return true;
      const st = subType.toLowerCase();
      const nm = (p.name || "").toLowerCase();
      const sf = (p.rawSubfilter || "").toLowerCase();
      const cd = (p.code || "").toUpperCase();
    
      if (st.includes("pln reguler"))
        return (
          cd.startsWith("PLN") &&
          !cd.startsWith("PLNP") &&
          !cd.startsWith("PLNB") &&
          !cd.startsWith("PLNF") &&
          !cd.startsWith("PLNZ")
        );
      if (st.includes("pln promo")) return cd.startsWith("PLNP") || nm.includes("promo");
      if (st.includes("pln h2h")) return cd.startsWith("PLNB");
      if (st.includes("pln full reply")) return cd.startsWith("PLNF");
      if (st.includes("driver") || st.includes("pengemudi"))
        return nm.includes("driver") || nm.includes("pengemudi") || sf.includes("driver") || sf.includes("pengemudi");
      if (st.includes("penumpang") || st.includes("customer"))
        return (
          nm.includes("penumpang") || nm.includes("customer") || sf.includes("penumpang") || sf.includes("customer")
        );
      if (st.includes("weekly pass")) return nm.includes("weekly") || nm.includes("pass");
    
      return nm.includes(st) || sf.includes(st);
    }
    
    function getSmartLocations(filterType) {
      if (!API_PRODUCTS || !API_PRODUCTS.length) return [];
      const locations = new Set();
      API_PRODUCTS.forEach((p) => {
        if ((p.filter || "").toUpperCase() === filterType) {
          let loc = p.nama || "";
          loc = loc.replace(/^(Cek|Bayar|Cek Tagihan|Bayar Tagihan)\s+/i, "");
          loc = loc.replace(/^(PDAM|PBB|Pajak PBB)\s+/i, "");
          loc = loc.trim();
          if (loc) locations.add(loc);
        }
      });
      return Array.from(locations).sort();
    }

    function getActiveProducts() {
      if (F.sid === 'xl_akrab') {
        const activeFilter = F.xlFilter || 'XLA';
        let list = API_XL_AKRAB;
        if (activeFilter === 'XLA') list = list.filter(p => p.code.toUpperCase().startsWith('XLA'));
        else if (activeFilter === 'FMX') list = list.filter(p => p.code.toUpperCase().startsWith('FMX'));
        else if (activeFilter === 'KDA') list = list.filter(p => p.code.toUpperCase().startsWith('KDA') || p.code.toUpperCase().startsWith('XDA'));
        return list.sort((a, b) => {
          const sA = parseInt((a.sub.match(/Stok:\s*(\d+)/) || [0, 0])[1]) || 0;
          const sB = parseInt((b.sub.match(/Stok:\s*(\d+)/) || [0, 0])[1]) || 0;
          return sB - sA;
        });
      }
      const s = SV[F.sid];
      const allProducts = getFilteredApiProducts(s, F.provider, F.customer, F.selectedLoc);
      let products = allProducts.filter((p) => matchSubType(p, F.subType));
      if (s.id === "tf_bebas" || s.free) {
        const provUpper = (F.provider || "").toUpperCase();
        if (provUpper.includes("DANA")) {
          const danaProds = products.filter(p => ["BBSD", "BBSDN"].includes((p.code||p.kode).toUpperCase()));
          if (danaProds.length > 0) {
            danaProds.sort((a,b) => (Number(a.price)||0) - (Number(b.price)||0));
            const selectedCode = danaProds[0].code || danaProds[0].kode;
            products = products.filter(p => (p.code||p.kode) === selectedCode);
          }
        } else if (provUpper.includes("GOPAY")) {
          const gopayProds = products.filter(p => !(p.name||"").toUpperCase().includes("DRIVER"));
          if (gopayProds.length > 0) {
            gopayProds.sort((a,b) => (Number(a.price)||0) - (Number(b.price)||0));
            const selectedCode = gopayProds[0].code || gopayProds[0].kode;
            products = products.filter(p => (p.code||p.kode) === selectedCode);
          }
        } else if (provUpper.includes("SHOPEE")) {
          const shopeeProds = products.filter(p => (p.code||p.kode).toUpperCase() === "BBSSH");
          if (shopeeProds.length > 0) {
            products = shopeeProds;
          }
        }
      }
      return products;
    }

        sid,
        provider: detectedOp || (s.providers ? s.providers[0] : ""),
        subType: "Semua",
        selectedLoc: "",
        locQuery: "",
        customer: prefill || "",
        product: null,
        bill: null,
        checking: false,
        amount: 0,
        admin: s.admin || 0,

      openSheet("svc", {

    function generateUniqueNominal(baseAmt) {
      if (!baseAmt || baseAmt < 10000) return { totalAmt: 0, code3: 0 };
      const activePending = (S.tx || []).filter(t => t.sid === 'topup' && t.status === 'pending');
      const usedTotals = activePending.map(t => t.total);
      let code3 = 0;
      let totalAmt = 0;
      let attempts = 0;
      do {
        code3 = Math.floor(Math.random() * 900) + 100;
        totalAmt = Math.floor(baseAmt / 1000) * 1000 + code3;
        attempts++;
      } while (usedTotals.includes(totalAmt) && attempts < 50);
      return { totalAmt, code3 };
    }

      async prosesKirimSaldo() {
        const t = document.getElementById("kirimTujuan").value.trim();
        const n = parseInt(document.getElementById("kirimNominal").value);
        if (!t) return toast("Tujuan wajib diisi", "error");
        if (!n || !Number.isInteger(n) || n < 1000) return toast("Minimal transfer Rp 1.000", "error");
        if (n <= 0) return toast("Nominal tidak valid", "error");
        if (S.balance < n) return toast("Saldo tidak mencukupi", "error");
        const now = Date.now();
        if (S.lastTfTime && (now - S.lastTfTime < 30000)) return toast("Tunggu 30 detik sebelum transfer lagi", "error");
        processing("Mencari pengguna...", async () => {
          try {
            const myUid = S.uid || (S.user && S.user.phone);
            let target = null;
            let resCek = null;
            try {
              // CEK TUJUAN melalui API terenkripsi (transfer.php)
              resCek = await callSecureApi("api/transfer.php", "cek_tujuan", { uid: myUid, target: t });
            } catch (e) { resCek = null; }
            if (resCek) {
              if (!resCek.status) return toast(resCek.message || "Gagal memproses", "error");
              if (!resCek.data.found) return toast("Pengguna tujuan tidak ditemukan", "error");
              if (resCek.data.self) return toast("Tidak bisa transfer ke diri sendiri", "error");
              target = { uid: resCek.data.target_uid, user: { name: resCek.data.target_name } };
            }
            if (!target) {
              // API tidak terjangkau -> fallback cara lama (list_users)
              const res = await fetch("manager.php?action=list_users");
              const data = await res.json();
              target = data.users?.find(u => u.uid === t || u.user?.phone === t || u.user?.name === t || u.user?.email === t);
              if (!target) return toast("Pengguna tujuan tidak ditemukan", "error");
              if (target.uid === S.uid) return toast("Tidak bisa transfer ke diri sendiri", "error");
            }
            closeSheet("kirim");
            setTimeout(() => {
              openPin(async () => {
                closeSheet("pin");
                processing("Mengirim saldo...", async () => {
                  let resTf = null;
                  try {
                    // KIRIM SALDO melalui API terenkripsi (transfer.php):
                    // server memvalidasi nominal (min. 1.000, tidak boleh
                    // negatif/nol), memotong saldo, dan mencatat transaksi.
                    resTf = await callSecureApi("api/transfer.php", "kirim", { uid: myUid, target: t, amount: n });
                  } catch (e) { resTf = null; }
                  if (resTf && resTf.status && resTf.data) {
                    S.balance = resTf.data.balance;
                    S.lastTfTime = Date.now();
                    const tx = resTf.data.tx;
                    S.tx.unshift(tx);
                    save();
                    showSuccess(tx);
                    render();
                    toast("Berhasil mengirim saldo", "success");
                  } else if (resTf && !resTf.status) {
                    // Ditolak server (nominal tidak valid, saldo kurang, cooldown, dll.)
                    toast(resTf.message || "Gagal memproses", "error");
                    render();
                  } else {
                    // Endpoint tidak terjangkau -> fallback logika lama
                    app.prosesKirimSaldoLokal(target);
                  }
                });
              });
            }, 200);
          } catch(e) {
             toast("Gagal memproses", "error");
          }
        });
      },

      async checkBill() {
        const s = SV[F.sid];
        let checkProduct = null;
        const allP = getFilteredApiProducts(s, F.provider, F.customer, F.selectedLoc);
        const products = getActiveProducts();
    
        if (F.product != null && products[F.product]) {
          checkProduct = products[F.product];
        } else {
          checkProduct = products.find((p) => isCekProduct(p.code || p.kode)) || allP.find((p) => isCekProduct(p.code || p.kode));
        }
    
        if (!checkProduct) {
          if (F.sid === "plnpasca") checkProduct = { kode: "CPLA", nama: "Cek&Bayar Listrik" };
          else if (F.sid === "pbb") checkProduct = { kode: "CPBB", nama: "Cek&Bayar PBB" };
          else if (F.sid === "multifinance") checkProduct = { kode: "CFIN", nama: "Cek&Bayar Cicilan Kredit" };
          else checkProduct = { kode: "CPAM", nama: "Cek&Bayar PDAM" };
        }
    
        const kodeCek = checkProduct.kode || checkProduct.code;
        F.checking = true;
        F.checkError = null;
        renderSvc();
    
        const pollCek = async () => {
          try {
            const apiUrl = F.sid === "xl_akrab" ? "api/api1.php" : "api/api4.php";
            const res = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "status", refid: t.ref }),
            });
            const data = await res.json();
            const d = data && data.data ? data.data : data || {};
            const isSuccess = data && (data.status === true || d.status === true || data.status === "true");
            const payToken = d.payment_token || data.payment_token || null;
            const ketStr = String(d.keterangan || data.message || "");
    
            if (isSuccess && payToken) {
              const hasAmtInd = d.ttag || d.harga || d.tagihan || d.amount || ketStr.match(/(TTAG|TOTAL BAYAR|TOTAL TAGIHAN|JUMLAH TAGIHAN|\/RP\d|RP\d|Rp\.\s*\d)/i);
              if (ketStr.includes("akan diproses") || !hasAmtInd) {
                toast("Pengecekan sedang diproses, mengecek ulang...", "info");
                setTimeout(pollCek, 2000);
                return;
              }
              
              let amtCandidates = [];
              if (d.ttag) amtCandidates.push(parseInt(d.ttag));
              if (d.harga) amtCandidates.push(parseInt(d.harga));
              if (d.tagihan) amtCandidates.push(parseInt(d.tagihan));
              if (d.amount) amtCandidates.push(parseInt(d.amount));
              
              if (ketStr) {
                const patterns = [
                  /TOTAL BAYAR\s*:\s*RP\s*([\d.,]+)/i,
                  /TOTAL TAGIHAN\s*:\s*RP\s*([\d.,]+)/i,
                  /JUMLAH TAGIHAN[^:]*:\s*RP\s*([\d.,]+)/i,
                  /TTAG\s*:\s*([\d.,]+)/i,
                  /TAGIHAN\s*:\s*([\d.,]+)/i,
                  /TOTAL\s*:\s*([\d.,]+)/i,
                  /\/RP\s*([\d.,]+)\//i,
                  /RP\s*([\d.,]+)/i,
                  /Rp\.?\s*([\d.,]+)/i
                ];
                patterns.forEach(regex => {
                  const m = ketStr.match(regex);
                  if (m) {
                    const cleanNum = parseInt(m[1].replace(/[.,]/g, ""));
                    if (!isNaN(cleanNum)) amtCandidates.push(cleanNum);
                  }
                });
              }
              let amt = amtCandidates.length > 0 ? Math.max(...amtCandidates) : 0;
              let custNameFound = d.nama || d.nama_pelanggan || d.customer_name || "";
              if (!custNameFound && ketStr) {
                const nmMatch =
                  ketStr.match(/SN:\s*([^\/]+)\//i) ||
                  ketStr.match(/A\/N\s+([^|]+)/i) ||
                  ketStr.match(/NAMA\s*:\s*([^|]+)/i) ||
                  ketStr.match(/PLN\s+([^|0-9]+)/i);
                if (nmMatch) custNameFound = nmMatch[1].trim();
              }
              let tarifFound = d.tarif || "";
              if (!tarifFound && ketStr) {
                const m = ketStr.match(/TARIF\s*:\s*([^\/|]+)/i);
                if (m) tarifFound = m[1].trim();
              }
              let dayaFound = d.daya || "";
              if (!dayaFound && ketStr) {
                const m = ketStr.match(/DAYA\s*:\s*([^\/|]+)/i);
                if (m) dayaFound = m[1].trim();

                const m = ketStr.match(/PERIODE\s*:\s*([^\/|.]+)/i);
                if (m) periodeFound = m[1].trim();
              }
              if (!amt || amt <= 0) {
                toast("Nominal tagihan riil (TTAG) belum ditemukan, mengecek ulang...", "warn");
                setTimeout(pollCek, 2000);
                return;

              F.checking = false;

                name: custNameFound || "Pelanggan " + F.customer,
                amount: amt,
                period: ketStr || "Periode Berjalan",
                payment_token: payToken,
                checkProduct: checkProduct || { kode: kodeCek },
                locName: F.selectedLoc,
                tarif: tarifFound,
                daya: dayaFound,
                periode: periodeFound,
              };

                d.message ||
                d.keterangan ||
                "Tagihan tidak ditemukan atau ID Pelanggan salah";
              F.checkError = errMsg;
              toast(errMsg, "error");
              renderSvc();

            F.checking = false;

      payNow() {
        if (app._isPaying) {
          toast("Transaksi sedang diproses, mohon tunggu...", "warn");
          return;
        }
        const total = calcTotal();
        if (F.method === "saldo" && S.balance < total) {
          toast("Saldo tidak mencukupi", "error");
          return;
        }
    
        app._isPaying = true;
        setTimeout(() => {
          app._isPaying = false;
        }, 3000);
    
        openPin(
          () => {
            closeSheet("pin");
            processing("Memproses transaksi...", async () => {
              const s = SV[F.sid];
              const products = getActiveProducts();
              const selectedProd = products[F.product] || {};
              const targetKode = selectedProd.code || selectedProd.kode || "";
              const isOpendenom = s.free || F.sid === "tf_bebas" || isBebasNominal(targetKode);
              const qtyVal = isOpendenom ? parseInt((F.free || "").replace(/\D/g, "")) || 0 : 0;
              const txRef = ref();
    
              if (F.method === "saldo") {
                let resPay = null;
                try {
                  // PEMOTONGAN SALDO dilakukan di SERVER melalui API
                  // terenkripsi (pembayaran.php): nominal divalidasi
                  // (harus bulat positif, tidak boleh 0/negatif), saldo
                  // dicek & dipotong secara atomik, lalu saldo baru
                  // dikembalikan ke klien.
                  resPay = await callSecureApi("api/pembayaran.php", "debit", {
                    uid: S.uid || (S.user && S.user.phone),
                    amount: total,
                    ref: txRef,
                  });
                } catch (e) { resPay = null; }
                if (resPay && resPay.status && resPay.data) {
                  S.balance = resPay.data.balance;
                } else if (resPay && !resPay.status) {
                  // Ditolak server (nominal tidak valid / saldo kurang)
                  toast(resPay.message || "Saldo tidak mencukupi", "error");
                  return;
                } else {
                  // Endpoint tidak terjangkau -> fallback logika lama
                  try {
                    const resU = await fetch("manager.php?action=list_users");
                    if (resU.ok) {
                      const dataU = await resU.json();
                      if (dataU && dataU.status && Array.isArray(dataU.users)) {
                        const myUid = S.uid || (S.user && S.user.phone);
                        const myAcc = dataU.users.find(u => String(u.uid) === String(myUid) || String(u.user?.phone) === String(S.user?.phone));
                        if (myAcc && myAcc.balance !== undefined) {
                          S.balance = parseFloat(myAcc.balance) || 0;
                        }
                      }
                    }
                  } catch(e) {}
                  if (S.balance < total) {
                    toast("Saldo tidak mencukupi", "error");
                    return;
                  }
                  S.balance -= total;
                }
              }
    
              const tx = {
                id: uid(),
                ref: txRef,
                sid: F.sid,
                serviceName: s.name,
                product: productName(),
                productCode: F.bill ? (F.bill.checkProduct?.kode || "") : (isOpendenom ? (targetKode || "PLNBBS") : targetKode),
                customer: F.customer,
                customerName: F.bill
                  ? F.bill.name
                  : s.lookup
                    ? custName(F.customer)
                    : s.op
                      ? detectOp(F.customer) + " Prabayar"
                      : "-",
                amount: total + F.discount - F.admin,
                admin: F.admin,
                discount: F.discount,
                total,
                method: F.method === "saldo" ? "Saldo PayNusa" : F.method,
                status: "pending",
                date: new Date().toISOString(),
                token: null,
                serial: null,
              };
    
              finishTx(tx);
    
              try {
                let reqBody = {};
                let apiUrl = "api/api4.php";
                if (F.sid === "xl_akrab") {
                  apiUrl = "api/api1.php";
                  reqBody = {
                    action: "order",
                    kode_produk: targetKode,
                    target: F.customer,
                    refid: tx.ref
                  };
                } else {
                  reqBody = { action: "bayar", ref_id: tx.ref };
                  if (F.bill && F.bill.payment_token) {
                    reqBody.payment_token = F.bill.payment_token;
                  } else if (isOpendenom) {
                    reqBody.kode = targetKode || "PLNBBS";
                    reqBody.tujuan = F.customer;
                    reqBody.qty = qtyVal;
                  } else {
                    reqBody.kode = targetKode;
                    reqBody.tujuan = F.customer;
                  }
                }
    
                const res = await fetch(apiUrl, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(reqBody),
                });
                const apiRes = await res.json();
                tx.raw_response = apiRes;
    
                if (apiRes && apiRes.status) {
                  const d = apiRes.data || {};
                  const snRaw = d.sn || apiRes.sn || "";
                  const msgRaw = apiRes.message || d.message || d.keterangan || "";
                  let extractedSn = snRaw && snRaw !== "-" ? snRaw : null;
                  if (!extractedSn && msgRaw) {
                    const m = String(msgRaw).match(/SN:\s*([^\r\n]+)/i);
                    if (m) extractedSn = m[1].trim();
                  }
                  if (extractedSn) {
                    tx.token = extractedSn;
                    tx.serial = extractedSn;
                  }
                  const st = (d.status_trx || apiRes.trx_status || "").toUpperCase();
                  if (st === "SUKSES" || st === "BERHASIL") {
                    tx.status = "success";
                  }
                } else {
                  toast(apiRes.message || "Order diterima API, menunggu proses...", "info");
                }
              } catch (e) {
                console.error("API Exec Error:", e);
              } finally {
                save();
                if (window.app && window.app.startAutoCheckPending) {
                  window.app.startAutoCheckPending();
                }
              }
            });
          },
          F.method === "card" ? "Masukkan PIN Kartu" : "Masukkan PIN Transaksi",
        );
      },

      async checkStatus(id) {
        const t = S.tx.find((x) => x.id === id);
        if (!t) return;
        closeSheet("td");
        processing("Mengecek status...", async () => {
          try {
            const apiUrl = t.sid === "xl_akrab" ? "api/api1.php" : "api/api4.php";
            const res = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "status", refid: t.ref }),
            });
            const data = await res.json();
            t.raw_response = data;
            const d = data && data.data ? data.data : data || {};
            const st = (d.status_trx || d.trx_status || data.trx_status || "").toUpperCase();
            if (st === "BERHASIL" || st === "SUKSES" || st === "SUCCESS") {
              t.status = "success";
              const snRaw = d.sn || data.sn || "";
              const msgRaw = d.keterangan || data.keterangan || data.message || d.message || "";
              let extractedSn = snRaw && snRaw !== "-" ? snRaw : null;
              if (!extractedSn && msgRaw) {
                const m = String(msgRaw).match(/SN:\s*([^\r\n]+)/i);
                if (m) {
                  let rawSnMatch = m[1].trim();
                  if (rawSnMatch.includes(".  ")) {
                    rawSnMatch = rawSnMatch.split(/\.\s+/)[0] + ".";
                  }
                  extractedSn = rawSnMatch;
                }
              }
              if (extractedSn) {
                t.serial = extractedSn;
                if (t.sid !== "pln") t.token = extractedSn;
              }
              if (msgRaw) t.keterangan = msgRaw;
              syncTxServer(t);
              toast("Pembayaran terkonfirmasi BERHASIL!", "success");
            } else if (st === "GAGAL" || st === "FAILED") {
              if (t.status !== "failed" && t.refund_status !== "DONE" && (t.method || "").toLowerCase().includes("saldo")) {
                S.balance += t.total;
                t.refund_status = "DONE";
              }
              t.status = "failed";
              const msgRaw = d.keterangan || data.keterangan || data.message || d.message || "";
              if (msgRaw) t.keterangan = msgRaw;
              syncTxServer(t);
              toast("Transaksi GAGAL. Saldo dikembalikan.", "error");
            } else {
              toast(d.keterangan || data.message || "Status transaksi masih diproses (MENUNGGU)", "info");
            }
          } catch (e) {
            toast("Gagal mengecek status ke server", "error");
          } finally {
            save();
            render();
            setTimeout(() => openTxDetail(id), 200);
          }
        });
      },

            } else {
              const container = document.getElementById('fullQrisContainer');
              if (container) {
                container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(dynamicQrisStr)}" class="w-full h-full object-contain" alt="QRIS" />`;
              }
            }
          }
        }, 100);
      },
      myQris() {
        closeSheet("qr");
        setTimeout(() => {
          openSheet("mq", { title: "QRIS Saya", sub: "Tunjukkan kode ini untuk menerima pembayaran" });
          setBody(
            "mq",
            `<div class="pb-8 text-center">
        <div class="card p-6 mx-auto" style="max-width:300px">
          <p class="font-extrabold txt">${S.user.name}</p><p class="text-[11.5px] muted font-semibold">NMID ID10${Math.floor(Math.random() * 9e8 + 1e8)}</p>
          <div class="mt-4 grid grid-cols-[repeat(21,1fr)] gap-[2px] mx-auto" style="width:210px">
            ${Array.from({ length: 441 })
              .map((_, i) => {
                const r = seedRand("q" + i)();
                return `<span style="aspect-ratio:1;background:${r > 0.5 ? "var(--text)" : "transparent"};border-radius:1px"></span>`;
              })
              .join("")}
          </div>
          <p class="text-[11px] muted font-bold mt-4">QRIS · Semua Pembayaran</p>
        </div>
        <button onclick="app.toast('QR berhasil disimpan ke galeri','success')" class="btn btn-ghost mt-4">Simpan Gambar QR</button></div>`,
          );
        }, 220);
      },
      /* profile */
      saveProfile() {
        S.user.name = document.getElementById("epName").value || S.user.name;
        S.user.phone = document.getElementById("epPhone").value;
        S.user.email = document.getElementById("epEmail").value;
        S.user.address = document.getElementById("epAddr").value;
        save();
        closeSheet("ep");
        render();
        toast("Profil berhasil diperbarui", "success");
      },
      changePin() {
        const o = document.getElementById("pinOld").value,
          n = document.getElementById("pinNew").value,
          n2 = document.getElementById("pinNew2").value;
        if (o !== S.pin) return toast("PIN lama salah", "error");
        if (n.length !== 6 || !/^\d+$/.test(n)) return toast("PIN baru harus 6 digit angka", "error");
        if (n !== n2) return toast("Konfirmasi PIN tidak cocok", "error");
        S.pin = n;
        save();
        closeSheet("sc");
        toast("PIN berhasil diubah", "success");
      },
      toggleSetting(k, inSheet) {
        S.settings[k] = !S.settings[k];
        save();
        applyTheme();
        render();
        if (inSheet) openSheetMenu("settings");
      },
      faq(i) {
        const e = document.getElementById("faq" + i);
        if (e) e.classList.toggle("hidden");
      },
      upgrade() {
        processing("Memuat penawaran...", () => {
          toast("Premium Rp29.000/bulan — fitur demo", "info");
        });
      },
      redeem(p) {
        if (S.points < p) return toast("Poin tidak mencukupi", "error");
        S.points -= p;
        S.balance += p * 10;
        save();
        render();
        toast(`${p.toLocaleString("id-ID")} poin ditukar jadi ${rp(p * 10)} saldo`, "success");
      },
      resetDemo() {
        openSheet("rs", { title: "Reset Data Demo?", sub: "Semua transaksi & saldo kembali ke awal" });
        setBody(
          "rs",
          `<div class="pb-6"><div class="flex items-start gap-2.5 p-3.5 rounded-2xl mb-4" style="background:rgba(239,68,68,.1)">
        ${ic("alert", "w-4.5 h-4.5 shrink-0 text-red-500", "2")}<p class="text-[12.5px] font-semibold text-red-500">Tindakan ini akan menghapus seluruh riwayat transaksi demo dan mengembalikan saldo ke Rp1.250.000.</p></div>
        <button onclick="app.doReset()" class="btn" style="background:#ef4444;color:#fff">Ya, Reset Sekarang</button>
        <button onclick="app.closeSheet('rs')" class="btn btn-ghost mt-2">Batal</button></div>`,
        );
      },
      doReset() {
        const dark = S.settings.dark;
        S = JSON.parse(JSON.stringify(DEFAULT));
        S.settings.dark = dark;
        save();
        closeAllSheets();
        render();
        toast("Data demo berhasil direset", "success");
      },
      logout() {
        openSheet("lo", { title: "Keluar dari akun?", sub: "Anda perlu masuk kembali untuk bertransaksi" });
        setBody(
          "lo",
          `<div class="pb-6"><button onclick="app.doLogout()" class="btn" style="background:#ef4444;color:#fff">Ya, Keluar</button>
        <button onclick="app.closeSheet('lo')" class="btn btn-ghost mt-2">Batal</button></div>`,
        );
      },
      doLogout() {
        closeAllSheets();
        S.loggedIn = false;
        S.rememberMe = false;
        localStorage.removeItem(KEY);
        save();
        render();
        toast("Anda telah keluar", "info");
      },
      async doLogin() {
        const phone = $("#loginPhone")?.value.trim();
        const password = $("#loginPass")?.value.trim();
        if (!phone || !password) {
          toast("Isi nomor HP dan kata sandi", "error");
          return;
        }
        processing("Memverifikasi...", async () => {
          try {
            const res = await fetch("manager.php?action=login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone, password }),
            });
            const data = await res.json();
            if (data.status && data.data) {
              const rem = document.getElementById("loginRemember")?.checked;
              S = { ...DEFAULT, ...data.data, loggedIn: true, tab: "home", rememberMe: rem };
              await fetchMarkupConfig();
              save();
              render();
              toast(
                "Selamat datang kembali, " +
                  S.user.name.split(" ")[0] +
                  "! (" +
                  (S.jenis_akun || "member").toUpperCase() +
                  ")",
                "success",
              );
            } else {
              toast(data.message || "Login gagal", "error");
            }
          } catch (e) {
            toast("Gagal terhubung ke manager.php", "error");
          }
        });
      },
      doResetPassword() {
        const name = $("#forgotName")?.value.trim();
        const phone = $("#forgotPhone")?.value.trim();
        const email = $("#forgotEmail")?.value.trim();
        const password = $("#forgotPass")?.value.trim();
        if (!name || !phone || !email || !password) {
          toast("Semua bidang wajib diisi!", "error");
          return;
        }
        processing("Mereset sandi...", async () => {
          try {
            const resU = await fetch("manager.php?action=list_users");
            const dataU = await resU.json();
            let targetUid = null;
            let targetJenis = "member";
            if (dataU && dataU.users) {
              const exists = dataU.users.find(u => u.user?.phone === phone && u.user?.email === email && u.user?.name === name);
              if (!exists) return toast("Data tidak cocok dengan akun manapun!", "error");
              targetUid = exists.uid || ('u_' + phone);
              targetJenis = exists.jenis_akun || "member";
            } else { return toast("Gagal mengambil data user", "error"); }
    
            const res = await fetch("manager.php?action=update_user_admin", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ uid: targetUid, password: password, jenis_akun: targetJenis, user: { name, phone, email } })
            });
            const data = await res.json();
            if (data.status || data.success) {
              toast("Kata sandi berhasil direset, silakan masuk!", "success");
              authMode = "login";
              render();
            } else {
              toast(data.message || "Gagal mereset kata sandi", "error");
            }
          } catch (e) { toast("Gagal terhubung ke server", "error"); }
        });
      },
      async doRegister() {
        const name = $("#regName")?.value.trim();
        const phone = $("#regPhone")?.value.trim();
        const email = $("#regEmail")?.value.trim();
        const address = $("#regAddr")?.value.trim();
        const password = $("#regPass")?.value.trim();
        const confirmPassword = $("#regPass2")?.value.trim();
        const pin = $("#regPin")?.value.trim();
    
        if (!name || !phone || !email || !address || !password || !pin) {
          toast("Semua bidang pendaftaran wajib diisi!", "error");
          return;
        }
        if (password !== confirmPassword) {
          toast("Konfirmasi kata sandi tidak cocok!", "error");
          return;
        }
        if (pin.length !== 6 || !/^[0-9]+$/.test(pin)) {
          toast("PIN transaksi harus 6 digit angka!", "error");
          return;
        }
    
        processing("Mendaftarkan akun...", async () => {
          try {
            const resU = await fetch("manager.php?action=list_users");
            const dataU = await resU.json();
            if (dataU && dataU.users) {
               const exists = dataU.users.find(u => u.user?.phone === phone || u.user?.email === email || u.user?.name === name);
               if (exists) {
                 toast("Nama, Email, atau No WA sudah terdaftar!", "error");
                 return;
               }
            }
            const res = await fetch("manager.php?action=register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, phone, email, address, password, confirmPassword, pin }),
            });
            const data = await res.json();
            if (data.status && data.data) {
              S = { ...DEFAULT, ...data.data, loggedIn: true, tab: "home" };
              await fetchMarkupConfig();
              save();
              render();
              toast("Pendaftaran berhasil! Jenis Akun: " + (S.jenis_akun || "member").toUpperCase(), "success");
            } else {
              toast(data.message || "Pendaftaran gagal", "error");
            }
          } catch (e) {
            toast("Gagal terhubung ke manager.php", "error");
          }
        });
      },
    };
    async function checkPendingTransactions() {
      try {
        if (S && S.loggedIn) {
          const resU = await fetch("manager.php?action=list_users");
          if (resU.ok) {
            const dataU = await resU.json();
            if (dataU && dataU.status && Array.isArray(dataU.users)) {
              const myUid = S.uid || (S.user && S.user.phone);
              const myAcc = dataU.users.find(u => String(u.uid) === String(myUid) || String(u.user?.phone) === String(S.user?.phone));
              if (myAcc) {
                let changed = false;
                // PROTEKSI RACE CONDITION: Abaikan data server jika lokal baru saja dipotong (jeda 5 detik)
                if (!window._lastLocalSyncBlock || Date.now() - window._lastLocalSyncBlock > 5000) {
                  if (myAcc.balance !== undefined && S.balance !== parseFloat(myAcc.balance)) { S.balance = parseFloat(myAcc.balance) || 0; changed = true; }
                  if (myAcc.points !== undefined && S.points !== parseInt(myAcc.points)) { S.points = parseInt(myAcc.points) || 0; changed = true; }
                  if (myAcc.jenis_akun && S.jenis_akun !== myAcc.jenis_akun) { S.jenis_akun = myAcc.jenis_akun; changed = true; }
                  if (myAcc.user && JSON.stringify(S.user) !== JSON.stringify({ ...S.user, ...myAcc.user })) { S.user = { ...S.user, ...myAcc.user }; changed = true; }
                  if (myAcc.uid && S.uid !== myAcc.uid) { S.uid = myAcc.uid; changed = true; }
                  if (changed) { save(); render(); }
                }
              }
            }
          }
        }
      } catch (e) {}
    
      try {
        const res = await fetch("manager.php?action=list_all_tx");
        if (res.ok) {
          const serverData = await res.json();
          if (serverData && serverData.status && Array.isArray(serverData.transactions)) {
            const allServerTx = serverData.transactions;
            const myUid = S.uid || (S.user && S.user.phone);
            const myPhone = S.user && S.user.phone;
    
            let txChanged = false;
            const validServerRefs = new Set();
            allServerTx.forEach(stx => {
              const isMine = String(stx.uid) === String(myUid) || 
                             (myPhone && (String(stx.customer) === String(myPhone) || String(stx.uid) === 'u_' + myPhone));
              if (stx.sid === 'terima_saldo' && String(stx.uid) === String(myUid)) {
                validServerRefs.add(stx.ref);
                if (!S.tx.find(ltx => ltx.ref === stx.ref)) {
                  S.tx.unshift(stx);
                  txChanged = true;
                }
                // SISTEM PROTEKSI DARI SERVER HOSTING
                // Hanya proses jika server menyatakan transaksi ini belum pernah di-klaim
                if (!stx.is_claimed) {
                  S.balance += stx.total;
                  
                  // 1. Tandai langsung di objek data transaksi
                  stx.is_claimed = true;
                  const localTx = S.tx.find(t => t.ref === stx.ref);
                  if (localTx) localTx.is_claimed = true;
                  
                  // 2. Tembak API manager untuk update permanen flag 'is_claimed' ke hosting
                  syncTxServer(stx);
                  
                  // 3. Tampilkan Notifikasi & Simpan Riwayat
                  const notifBody = `Anda menerima saldo Rp ${stx.total.toLocaleString('id-ID')} dari ${stx.customerName}.`;
                  S.notifs.unshift({
                    id: uid(), ref: stx.ref, title: "Dana Masuk!", body: notifBody,
                    time: new Date().toISOString(), read: false, type: "success"
                  });
                  txChanged = true;
                  
                  if (window.app && window.app.showPopupNotif) {
                     window.app.showPopupNotif(`Transfer Masuk Rp ${stx.total.toLocaleString('id-ID')}`, `Dari: ${stx.customerName}`);
                  }
                }
                return;
              }
              if (isMine) {
                validServerRefs.add(stx.ref);
                const idx = S.tx.findIndex(ltx => ltx.ref === stx.ref || ltx.id === stx.id);
                if (idx === -1) {
                  S.tx.push(stx);
                  txChanged = true;
                } else {
                  const oldSt = S.tx[idx].status;
                  if (oldSt !== stx.status || S.tx[idx].refund_status !== stx.refund_status) {
                    if (S.tx[idx].sid === 'topup' && stx.status === 'success' && oldSt !== 'success') {
                      S.balance += stx.total;
                      toast("Top Up sebesar " + rp(stx.total) + " BERHASIL diterima!", "success");
                      if (window.app) window.app.closeSheet('tuActive');
                    } else if (S.tx[idx].sid === 'topup' && stx.status === 'failed' && oldSt !== 'failed') {
                      toast("Top Up sebesar " + rp(stx.total) + " DITOLAK / GAGAL", "error");
                      if (window.app) window.app.closeSheet('tuActive');
                    } else if (stx.status === 'failed' && oldSt !== 'failed' && S.tx[idx].refund_status !== 'DONE' && (S.tx[idx].method || '').toLowerCase().includes('saldo')) {
                      S.balance += S.tx[idx].total;
                      stx.refund_status = 'DONE';
                      toast("Transaksi " + S.tx[idx].product + " GAGAL. Saldo dikembalikan.", "error");
                    }
                    S.tx[idx] = { ...S.tx[idx], ...stx };
                    txChanged = true;
                  }
                }
              }
            });
    
            const origLen = S.tx.length;
            S.tx = S.tx.filter(ltx => validServerRefs.has(ltx.ref) || ltx.status === 'pending');
            if (S.tx.length !== origLen) txChanged = true;
    
            if (txChanged) {
              S.tx.sort((a, b) => new Date(b.date) - new Date(a.date));
              save();
              render();
            }
    
            const activePending = []; // Bugfix: Mencegah double processing karena status sudah diupdate di loop atas
            for (const tx of activePending) {
              const matched = allServerTx.find(st => st.ref === tx.ref || st.id === tx.id);
              if (matched && matched.status !== 'pending') {
                const oldStatus = tx.status;
                tx.status = matched.status;
                if (matched.keterangan) tx.keterangan = matched.keterangan;
                if (matched.refund_status) tx.refund_status = matched.refund_status;
                
                if (tx.sid === 'topup' && matched.status === 'success' && oldStatus !== 'success') {
                  S.balance += matched.total;
                  toast("Top Up sebesar " + rp(matched.total) + " BERHASIL diterima!", "success");
                  app.closeSheet('tuActive');
                } else if (tx.sid === 'topup' && matched.status === 'failed' && oldStatus !== 'failed') {
                  toast("Top Up sebesar " + rp(matched.total) + " DITOLAK / GAGAL", "error");
                  app.closeSheet('tuActive');
                } else if (matched.status === 'failed' && oldStatus !== 'failed' && tx.refund_status !== 'DONE' && (tx.method || '').toLowerCase().includes('saldo')) {
                  S.balance += tx.total;
                  tx.refund_status = 'DONE';
                  toast("Transaksi " + tx.product + " GAGAL. Saldo dikembalikan.", "error");
                }
                save();
                render();
              }
            }
          }
        }
      } catch (e) {}
    
      const pendingList = (S.tx || []).filter((t) => t.status === "pending");
      for (const tx of pendingList) {
        if (tx.sid === 'topup') continue;
        if (tx.status !== 'pending') continue;
        try {
          const apiUrl = tx.sid === "xl_akrab" ? "api/api1.php" : "api/api4.php";
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "status", refid: tx.ref }),
          });
          const data = await res.json();
          if (data) {
            const d = data.data || data;
            const st = (d.status_trx || d.trx_status || data.trx_status || "").toUpperCase();
            if (st === "BERHASIL" || st === "SUKSES" || st === "SUCCESS") {
              tx.status = "success";
              const snRaw = d.sn || data.sn || "";
              const msgRaw = d.keterangan || data.keterangan || data.message || d.message || "";
              let extractedSn = snRaw && snRaw !== "-" ? snRaw : null;
              if (!extractedSn && msgRaw) {
                const m = String(msgRaw).match(/SN:\s*([^\r\n]+)/i);
                if (m) {
                  let rawSnMatch = m[1].trim();
                  if (rawSnMatch.includes(".  ")) {
                    rawSnMatch = rawSnMatch.split(/\.\s+/)[0] + ".";
                  }
                  extractedSn = rawSnMatch;
                }
              }
              if (extractedSn) {
                tx.serial = extractedSn;
                if (tx.sid !== "pln") tx.token = extractedSn;
              }
              if (msgRaw) tx.keterangan = msgRaw;
              syncTxServer(tx);
              toast("Transaksi " + tx.product + " BERHASIL!", "success");
              save();
              render();
            } else if (st === "GAGAL" || st === "FAILED") {
              if (tx.status !== "failed" && tx.refund_status !== "DONE" && (tx.method || "").toLowerCase().includes("saldo")) {
                S.balance += tx.total;
                tx.refund_status = "DONE";
              }
              tx.status = "failed";
              const msgRaw = d.keterangan || data.keterangan || data.message || d.message || "";
              if (msgRaw) tx.keterangan = msgRaw;
              syncTxServer(tx);
              toast("Transaksi " + tx.product + " GAGAL. Saldo dikembalikan.", "error");
              save();
              render();
            }
          }
        } catch (e) {}
      }
    }
    
    let autoCheckInterval = null;
    function startAutoCheckPending() {
      checkPendingTransactions();
      if (!autoCheckInterval) {
        autoCheckInterval = setInterval(checkPendingTransactions, 6000);
      }
    }
    app.startAutoCheckPending = startAutoCheckPending;
    window.app = app;
    async function fetchSiteSettings() {
      try {
        const res = await fetch('seting.php');
        if (res.ok) {
          const data = await res.json();
          if (data && data.settings) {
            SITE_SETTINGS = data.settings;
            if (SITE_SETTINGS.banks && Array.isArray(SITE_SETTINGS.banks) && SITE_SETTINGS.banks.length) {
              BANKS.length = 0;
              SITE_SETTINGS.banks.forEach(b => BANKS.push(typeof b === 'object' ? b.bank : b));
            }
            if (SITE_SETTINGS.vouchers && Array.isArray(SITE_SETTINGS.vouchers) && SITE_SETTINGS.vouchers.length) {
              S.vouchers = SITE_SETTINGS.vouchers;
            }
            if (SITE_SETTINGS.app_title) document.title = SITE_SETTINGS.app_title;
            render();
          }
        }
      } catch (e) {}
    }
    fetchSiteSettings();
    fetchMarkupConfig();
    /* init */
    applyTheme();
    render();
    startAutoCheckPending();
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1]);
    });
  </script>
